<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Small Intestine Villi/Submucosa &amp; Large Intestine Anatomy</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Digestive System • เปรียบเทียบลำไส้เล็ก (Villi, Lacteals, Peyer&apos;s patches) และลำไส้ใหญ่ (Taeniae coli, Appendix)</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Left Box: Intestinal Villus &amp; Submucosal Features -->
      <rect x="60" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="270" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">SMALL INTESTINE VILLUS &amp; SUBMUCOSA</text>
      <!-- Finger-like Villi -->
      <path d="M125,380 L125,210 C125,155 215,155 215,210 L215,380 L285,380 L285,210 C285,155 375,155 375,210 L375,380" fill="#fbcfe8" stroke="#be185d" stroke-width="3.5"/>
      <!-- Central Green Lacteal inside Villus -->
      <path d="M170,385 L170,205 M330,385 L330,205" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
      <!-- Brunner's Glands (Duodenum) vs Peyer's Patches (Ileum) in Submucosa -->
      <rect x="95" y="385" width="350" height="125" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <circle cx="165" cy="445" r="28" fill="#fde047" stroke="#ca8a04" stroke-width="2.5"/>
      <circle cx="335" cy="445" r="32" fill="#c084fc" stroke="#6b21a8" stroke-width="2.5"/>

      <!-- Right Box: Large Intestine Frame, Cecum &amp; Appendix -->
      <rect x="515" y="95" width="425" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="727" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">LARGE INTESTINE (COLON, CECUM &amp; APPENDIX)</text>
      <!-- Colon Frame with Haustra -->
      <path d="M610,435 L610,235 L845,235 L845,425 L745,425 L745,505" fill="none" stroke="#fb7185" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Taeniae Coli (Longitudinal ribbon band) -->
      <path d="M610,445 L610,235 L845,235 L845,425 L745,425" fill="none" stroke="#fef08a" stroke-width="6"/>
      <!-- Vermiform Appendix hanging from Cecum -->
      <path d="M595,455 C575,485 590,515 620,515" fill="none" stroke="#e11d48" stroke-width="12" stroke-linecap="round"/>
      <!-- Ileocecal junction -->
      <path d="M675,415 L625,415" stroke="#f43f5e" stroke-width="20"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="170" y1="235" x2="270" y2="175" stroke="#059669" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="170" cy="235" r="6" fill="#059669" stroke="#ffffff" stroke-width="2" />
      <circle cx="170" cy="235" r="11" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="153" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#059669" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="270" y="153" width="28" height="44" rx="8" fill="#059669" />
        <text x="284" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="306" y="171" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Villus &amp; Central Lacteal</text>
        <text x="306" y="188" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">วิลไลและหลอดน้ำเหลือง Lacteal (ดูดซึมไขมัน Chylomicrons)</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="165" y1="445" x2="270" y2="355" stroke="#d97706" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="165" cy="445" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="165" cy="445" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="333" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="270" y="333" width="28" height="44" rx="8" fill="#d97706" />
        <text x="284" y="360" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="306" y="351" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Brunner&apos;s Glands (Duodenum Submucosa)</text>
        <text x="306" y="368" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ต่อมบรุนเนอร์ในชั้น Submucosa ของ Duodenum (หลั่งเมือกด่าง)</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="335" y1="445" x2="270" y2="495" stroke="#7e22ce" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="335" cy="445" r="6" fill="#7e22ce" stroke="#ffffff" stroke-width="2" />
      <circle cx="335" cy="445" r="11" fill="none" stroke="#7e22ce" stroke-width="1.5" opacity="0.5" />
      
        <rect x="15" y="473" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#7e22ce" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="15" y="473" width="28" height="44" rx="8" fill="#7e22ce" />
        <text x="29" y="500" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="51" y="491" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Peyer&apos;s Patches (Ileum Submucosa)</text>
        <text x="51" y="508" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">กลุ่มเนื้อเยื่อน้ำเหลือง MALT หนาแน่นในลำไส้เล็กส่วน Ileum</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="725" y1="235" x2="715" y2="180" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="725" cy="235" r="6" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
      <circle cx="725" cy="235" r="11" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5" />
      
        <rect x="460" y="158" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#ca8a04" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="460" y="158" width="28" height="44" rx="8" fill="#ca8a04" />
        <text x="474" y="185" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="496" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Taeniae Coli &amp; Haustra</text>
        <text x="496" y="193" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">แถบกล้ามเนื้อแนวยาว 3 แถบ ดึงให้ลำไส้ใหญ่โป่งเป็นกระพุ้ง Haustra</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="635" y1="415" x2="715" y2="345" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="635" cy="415" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="635" cy="415" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="323" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#e11d48" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="323" width="28" height="44" rx="8" fill="#e11d48" />
        <text x="729" y="350" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="751" y="341" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Ileocecal Valve &amp; Cecum</text>
        <text x="751" y="358" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ลิ้นกั้นระหว่าง Ileum กับ Cecum ป้องกันแบคทีเรียไหลย้อนกลับ</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="595" y1="495" x2="715" y2="485" stroke="#be123c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="595" cy="495" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2" />
      <circle cx="595" cy="495" r="11" fill="none" stroke="#be123c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="463" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#be123c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="463" width="28" height="44" rx="8" fill="#be123c" />
        <text x="729" y="490" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="751" y="481" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Vermiform Appendix (McBurney&apos;s Point)</text>
        <text x="751" y="498" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ไส้ติ่ง (โคนอยู่จุดรวม Taeniae coli ตรงกับ McBurney&apos;s point)</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>