<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Coronary Arteries &amp; Cardiac Venous Drainage</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Cardiovascular System • หลอดเลือดแดงโคโรนารี (RCA, LCA, LAD, LCx) และหลอดเลือดดำหัวใจ</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Heart Base &amp; Surface -->
      <path d="M350,175 C295,225 300,375 375,460 L535,535 C635,480 685,355 650,220 C620,170 530,160 470,175 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3.5" filter="url(#dropShadow)"/>
      <!-- Ascending Aorta Root -->
      <path d="M465,110 L465,215 C465,235 535,235 535,215 L535,110 Z" fill="url(#oxyBlood)" stroke="#7f1d1d" stroke-width="3"/>
      <!-- Right Coronary Artery (RCA) &amp; Marginal Branch -->
      <path d="M465,205 C405,215 355,255 345,335 C340,385 370,435 430,465" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
      <!-- Left Coronary Artery (LCA) main stem -->
      <path d="M535,200 L585,215" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
      <!-- Circumflex Artery (LCx) -->
      <path d="M585,215 C630,230 655,270 645,325" fill="none" stroke="#dc2626" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Anterior Interventricular Artery (LAD - Widow Maker) -->
      <path d="M585,215 C555,280 540,395 525,515" fill="none" stroke="#b91c1c" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M560,310 L605,360 M545,390 L585,435" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <!-- Great Cardiac Vein &amp; Coronary Sinus (Dashed Blue) -->
      <path d="M510,505 C525,390 540,285 575,230 C615,245 620,295 580,315 L445,315" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="8,4" stroke-linecap="round"/>
      <!-- Ischemic Zone Highlight at Apex/Anterior Wall -->
      <ellipse cx="550" cy="445" rx="45" ry="35" fill="#7f1d1d" fill-opacity="0.28" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="465" y1="195" x2="280" y2="165" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="465" cy="195" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="465" cy="195" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="143" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="143" width="28" height="44" rx="8" fill="#dc2626" />
        <text x="39" y="170" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="61" y="161" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Aortic Sinus (Origin of Coronary a.)</text>
        <text x="61" y="178" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">จุดกำเนิดหลอดเลือดโคโรนารีที่โคน Aorta</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="365" y1="270" x2="280" y2="275" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="365" cy="270" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="365" cy="270" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="253" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#e11d48" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="253" width="28" height="44" rx="8" fill="#e11d48" />
        <text x="39" y="280" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="61" y="271" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Right Coronary Artery (RCA)</text>
        <text x="61" y="288" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือดโคโรนารีขวา (เลี้ยง RA, RV, SA/AV node)</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="368" y1="415" x2="280" y2="415" stroke="#be123c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="368" cy="415" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2" />
      <circle cx="368" cy="415" r="11" fill="none" stroke="#be123c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="393" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#be123c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="393" width="28" height="44" rx="8" fill="#be123c" />
        <text x="39" y="420" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="61" y="411" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Right Marginal Artery</text>
        <text x="61" y="428" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">แขนงมาร์จินัลขวาเลี้ยงผนังด้านข้าง RV</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="552" y1="345" x2="715" y2="365" stroke="#991b1b" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="552" cy="345" r="6" fill="#991b1b" stroke="#ffffff" stroke-width="2" />
      <circle cx="552" cy="345" r="11" fill="none" stroke="#991b1b" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="343" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#991b1b" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="343" width="28" height="44" rx="8" fill="#991b1b" />
        <text x="729" y="370" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="751" y="361" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Anterior Interventricular Artery (LAD)</text>
        <text x="751" y="378" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือด LAD (&quot;Widow maker&quot; เลี้ยงผนังหน้า LV)</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="638" y1="265" x2="715" y2="225" stroke="#d97706" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="638" cy="265" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="638" cy="265" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="203" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="203" width="28" height="44" rx="8" fill="#d97706" />
        <text x="729" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="751" y="221" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Circumflex Artery (LCx)</text>
        <text x="751" y="238" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือดเซอร์คัมเฟลกซ์อ้อมไปด้านหลังซ้าย</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="485" y1="315" x2="715" y2="475" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="485" cy="315" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
      <circle cx="485" cy="315" r="11" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="453" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#2563eb" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="453" width="28" height="44" rx="8" fill="#2563eb" />
        <text x="729" y="480" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="751" y="471" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Coronary Sinus &amp; Great Cardiac Vein</text>
        <text x="751" y="488" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">แอ่งรวมเลือดดำหัวใจเทเข้าสู่ Right Atrium</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>