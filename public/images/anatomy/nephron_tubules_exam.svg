<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Nephron Tubular Segments: PCT, Loop of Henle, DCT &amp; Collecting Duct</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Urinary System • ท่อหน่วยไตส่วนต่างๆ และกลไกการดูดซึมกลับและสร้างปัสสาวะเข้มข้น</text>
  <rect x="770" y="18" width="205" height="30" rx="15" fill="#dc2626" /><text x="872" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">❓ ภาพโจทย์สอบระบุตำแหน่ง (Exam)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Cortex-Medulla Divider Line -->
      <line x1="80" y1="245" x2="920" y2="245" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10,6"/>
      <text x="145" y="232" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#475569">RENAL CORTEX (300 mOsm/L)</text>
      <text x="145" y="268" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#9f1239">RENAL MEDULLA (Up to 1,200 mOsm/L)</text>

      <!-- Glomerulus &amp; Bowman's Capsule -->
      <circle cx="245" cy="165" r="34" fill="#fef08a" stroke="#ca8a04" stroke-width="3.5"/>
      <circle cx="245" cy="165" r="20" fill="#ef4444"/>
      <!-- Proximal Convoluted Tubule (PCT) -->
      <path d="M279,165 C335,135 375,195 405,165 C435,135 435,215 415,245" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
      <!-- Thin Descending Limb of Loop of Henle -->
      <path d="M415,245 L415,475 C415,515 495,515 495,475 L495,385" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <!-- Thick Ascending Limb (TAL - NKCC2) -->
      <path d="M495,385 L495,215" fill="none" stroke="#ec4899" stroke-width="18" stroke-linecap="round"/>
      <!-- Distal Convoluted Tubule (DCT) -->
      <path d="M495,215 C495,145 575,145 625,175 L705,175" fill="none" stroke="#a855f7" stroke-width="15" stroke-linecap="round"/>
      <!-- Collecting Duct (Cortical &amp; Medullary) -->
      <path d="M705,135 L705,525" fill="none" stroke="#eab308" stroke-width="24" stroke-linecap="round"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="355" y1="165" x2="260" y2="115" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="355" cy="165" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="355" cy="165" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="216" y="98" width="44" height="34" rx="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="238" y="121" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="415" y1="365" x2="260" y2="365" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="415" cy="365" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
      <circle cx="415" cy="365" r="11" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
      
        <rect x="216" y="348" width="44" height="34" rx="8" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="238" y="371" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="455" y1="502" x2="260" y2="505" stroke="#0369a1" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="455" cy="502" r="6" fill="#0369a1" stroke="#ffffff" stroke-width="2" />
      <circle cx="455" cy="502" r="11" fill="none" stroke="#0369a1" stroke-width="1.5" opacity="0.5" />
      
        <rect x="216" y="488" width="44" height="34" rx="8" fill="#0369a1" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="238" y="511" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="495" y1="315" x2="720" y2="315" stroke="#db2777" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="495" cy="315" r="6" fill="#db2777" stroke="#ffffff" stroke-width="2" />
      <circle cx="495" cy="315" r="11" fill="none" stroke="#db2777" stroke-width="1.5" opacity="0.5" />
      
        <rect x="720" y="298" width="44" height="34" rx="8" fill="#db2777" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="742" y="321" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="585" y1="162" x2="720" y2="145" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="585" cy="162" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2" />
      <circle cx="585" cy="162" r="11" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.5" />
      
        <rect x="720" y="128" width="44" height="34" rx="8" fill="#9333ea" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="742" y="151" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="705" y1="425" x2="720" y2="455" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="705" cy="425" r="6" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
      <circle cx="705" cy="425" r="11" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5" />
      
        <rect x="720" y="438" width="44" height="34" rx="8" fill="#ca8a04" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="742" y="461" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>