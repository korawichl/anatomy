<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Lymph Node Structure, Spleen Pulp &amp; Thoracic Duct Drainage</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Lymphatic System • โครงสร้างต่อมน้ำเหลือง ม้าม (White/Red Pulp) และท่อน้ำเหลืองใหญ่</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Bean-shaped Lymph Node -->
      <path d="M220,175 C135,175 125,445 220,455 C285,460 325,400 305,345 C290,315 290,295 305,265 C325,215 285,175 220,175 Z" fill="#a7f3d0" stroke="#047857" stroke-width="4" filter="url(#dropShadow)"/>
      <!-- Afferent Lymphatic Vessels (Convex side) -->
      <path d="M95,215 L155,235 M85,315 L142,315 M95,415 L155,395" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <!-- Germinal Centers (Cortex Follicles) -->
      <circle cx="205" cy="235" r="26" fill="#059669" stroke="#064e3b" stroke-width="2"/>
      <circle cx="205" cy="235" r="14" fill="#6ee7b7"/>
      <circle cx="195" cy="315" r="26" fill="#059669" stroke="#064e3b" stroke-width="2"/>
      <circle cx="195" cy="315" r="14" fill="#6ee7b7"/>
      <circle cx="205" cy="395" r="26" fill="#059669" stroke="#064e3b" stroke-width="2"/>
      <circle cx="205" cy="395" r="14" fill="#6ee7b7"/>
      <!-- Efferent Vessel at Hilum -->
      <path d="M298,305 L385,295 M298,330 L385,345" stroke="#047857" stroke-width="8" stroke-linecap="round"/>

      <!-- Right Side: Spleen &amp; Thoracic Duct Diagram -->
      <rect x="490" y="110" width="445" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="712" y="138" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#881337" text-anchor="middle">SPLEEN HISTOLOGY (WHITE PULP vs RED PULP)</text>
      <ellipse cx="712" cy="215" rx="165" ry="65" fill="#9f1239" stroke="#4c0519" stroke-width="3"/>
      <circle cx="645" cy="215" r="28" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>
      <circle cx="645" cy="215" r="7" fill="#ef4444"/>
      <circle cx="765" cy="215" r="28" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>
      <circle cx="765" cy="215" r="7" fill="#ef4444"/>

      <!-- Cisterna Chyli &amp; Thoracic Duct -->
      <rect x="490" y="335" width="445" height="195" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <path d="M710,505 C690,485 690,455 710,445 L710,365 L645,365" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="710" cy="480" rx="22" ry="30" fill="#10b981" stroke="#065f46" stroke-width="2.5"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="115" y1="222" x2="270" y2="125" stroke="#059669" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="115" cy="222" r="6" fill="#059669" stroke="#ffffff" stroke-width="2" />
      <circle cx="115" cy="222" r="11" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="103" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#059669" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="270" y="103" width="28" height="44" rx="8" fill="#059669" />
        <text x="284" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="306" y="121" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Afferent Lymphatic Vessels</text>
        <text x="306" y="138" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ท่อน้ำเหลืองนำเข้าทางด้านนูน (มีหลายท่อ)</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="205" y1="235" x2="270" y2="225" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="205" cy="235" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="2" />
      <circle cx="205" cy="235" r="11" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="203" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="270" y="203" width="28" height="44" rx="8" fill="#0d9488" />
        <text x="284" y="230" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="306" y="221" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Germinal Center in Cortex</text>
        <text x="306" y="238" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ศูนย์กลางแบ่งตัวของ B-lymphocytes ในชั้น Cortex</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="345" y1="300" x2="270" y2="475" stroke="#047857" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="345" cy="300" r="6" fill="#047857" stroke="#ffffff" stroke-width="2" />
      <circle cx="345" cy="300" r="11" fill="none" stroke="#047857" stroke-width="1.5" opacity="0.5" />
      
        <rect x="15" y="453" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#047857" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="15" y="453" width="28" height="44" rx="8" fill="#047857" />
        <text x="29" y="480" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="51" y="471" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Efferent Lymphatic Vessel at Hilum</text>
        <text x="51" y="488" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ท่อน้ำเหลืองนำออกบริเวณขั้วรอยบุ๋ม (Hilum)</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="645" y1="215" x2="715" y2="165" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="645" cy="215" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2" />
      <circle cx="645" cy="215" r="11" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="143" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#9333ea" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="143" width="28" height="44" rx="8" fill="#9333ea" />
        <text x="729" y="170" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="751" y="161" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Splenic White Pulp (Lymphocytes)</text>
        <text x="751" y="178" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">เนื้อเยื่อม้ามส่วนสีขาว (T &amp; B cells รอบหลอดเลือดแดง)</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="825" y1="215" x2="715" y2="285" stroke="#be123c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="825" cy="215" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2" />
      <circle cx="825" cy="215" r="11" fill="none" stroke="#be123c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="460" y="263" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#be123c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="460" y="263" width="28" height="44" rx="8" fill="#be123c" />
        <text x="474" y="290" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="496" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Splenic Red Pulp (Cords of Billroth)</text>
        <text x="496" y="298" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">เนื้อเยื่อม้ามส่วนสีแดง (ทำลาย RBC ที่หมดอายุ &gt;120 วัน)</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="710" y1="480" x2="715" y2="465" stroke="#10b981" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="710" cy="480" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <circle cx="710" cy="480" r="11" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="443" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#10b981" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="443" width="28" height="44" rx="8" fill="#10b981" />
        <text x="729" y="470" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="751" y="461" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Cisterna Chyli &amp; Thoracic Duct</text>
        <text x="751" y="478" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">กระเปาะพักน้ำเหลืองระดับ L1-L2 ต้นกำเนิด Thoracic duct</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>