<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Glomerular Filtration Pressures (NFP) &amp; RAAS Hormonal Cascade</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Urinary System • แรงดันสุทธิในการกรอง (NFP = 10 mmHg) และกลไกควบคุมความดันโลหิต RAAS</text>
  <rect x="770" y="18" width="205" height="30" rx="15" fill="#dc2626" /><text x="872" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">❓ ภาพโจทย์สอบระบุตำแหน่ง (Exam)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Left Box: Net Filtration Pressure Forces -->
      <rect x="60" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="270" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">GLOMERULAR FILTRATION FORCES</text>
      <!-- Capillary vs Capsule Box -->
      <rect x="105" y="165" width="145" height="260" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text x="177" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">GLOMERULUS</text>
      <rect x="290" y="165" width="145" height="260" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
      <text x="362" y="195" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">BOWMAN'S SPACE</text>
      <!-- Arrows for GHP (55 out), CHP (15 in), BCOP (30 in) -->
      <path d="M210,240 L325,240" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
      <polygon points="325,228 345,240 325,252" fill="#16a34a"/>
      <path d="M330,310 L225,310" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
      <polygon points="225,300 208,310 225,320" fill="#dc2626"/>
      <path d="M330,370 L225,370" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
      <polygon points="225,360 208,370 225,380" fill="#ea580c"/>
      <rect x="120" y="450" width="300" height="48" rx="10" fill="#0f172a"/>
      <text x="270" y="479" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">NFP = 55 - (15 + 30) = +10 mmHg</text>

      <!-- Right Box: RAAS Pathway -->
      <rect x="515" y="95" width="425" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="727" y="125" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">RENIN-ANGIOTENSIN-ALDOSTERONE SYSTEM</text>
      <rect x="615" y="155" width="225" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="615" y="255" width="225" height="48" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
      <rect x="615" y="355" width="225" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
      <rect x="615" y="455" width="225" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
      <path d="M727,203 L727,255 M727,303 L727,355 M727,407 L727,455" stroke="#475569" stroke-width="3"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="270" y1="240" x2="270" y2="150" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="270" cy="240" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
      <circle cx="270" cy="240" r="11" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="133" width="44" height="34" rx="8" fill="#16a34a" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="292" y="156" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="270" y1="310" x2="270" y2="310" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="270" cy="310" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="270" cy="310" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="293" width="44" height="34" rx="8" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="292" y="316" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="270" y1="370" x2="270" y2="415" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="270" cy="370" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
      <circle cx="270" cy="370" r="11" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="270" y="398" width="44" height="34" rx="8" fill="#ea580c" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="292" y="421" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="727" y1="180" x2="715" y2="180" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="727" cy="180" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
      <circle cx="727" cy="180" r="11" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5" />
      
        <rect x="671" y="163" width="44" height="34" rx="8" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="693" y="186" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="727" y1="380" x2="715" y2="335" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="727" cy="380" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="727" cy="380" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="671" y="318" width="44" height="34" rx="8" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="693" y="341" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="727" y1="480" x2="715" y2="480" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="727" cy="480" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="727" cy="480" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="671" y="463" width="44" height="34" rx="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="693" y="486" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>