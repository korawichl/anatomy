<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Internal Anatomy of the Heart: Chambers, Valves &amp; Great Vessels</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Cardiovascular System • ภาพตัดขวางภายในห้องหัวใจ ลิ้นหัวใจทั้ง 4 และหลอดเลือดใหญ่</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Superior &amp; Inferior Vena Cava -->
      <path d="M375,110 L375,210 L415,210 L415,110 Z" fill="url(#deoxyBlood)" stroke="#1e3a8a" stroke-width="2.5"/>
      <path d="M380,430 L380,535 L420,535 L420,430 Z" fill="url(#deoxyBlood)" stroke="#1e3a8a" stroke-width="2.5"/>
      <!-- Aortic Arch -->
      <path d="M510,230 C510,115 620,115 620,210 L580,210 C580,155 545,155 545,230 Z" fill="url(#oxyBlood)" stroke="#7f1d1d" stroke-width="3"/>
      <!-- Pulmonary Trunk -->
      <path d="M465,260 L465,155 L395,135 L405,110 L505,135 L585,120 L590,148 L502,165 L502,260 Z" fill="url(#deoxyBlood)" stroke="#1e3a8a" stroke-width="2.5"/>
      <!-- Outer Myocardium Contour -->
      <path d="M340,210 C290,260 295,380 365,455 L545,535 C635,485 685,365 655,245 C635,195 570,190 520,200 Z" fill="#fda4af" stroke="#881337" stroke-width="4" filter="url(#dropShadow)"/>
      <!-- Thick Left Ventricular Wall -->
      <path d="M535,515 C615,465 655,355 630,265 L595,280 C610,350 580,440 525,480 Z" fill="#e11d48" opacity="0.65"/>
      <!-- Right Atrium (RA) -->
      <path d="M355,215 C325,245 325,310 365,335 L445,335 L445,215 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2.5"/>
      <!-- Fossa Ovalis on Interatrial septum -->
      <ellipse cx="430" cy="275" rx="12" ry="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="3,2"/>
      <!-- Left Atrium (LA) &amp; 4 Pulmonary Veins -->
      <path d="M645,215 L690,195 M650,245 L695,235" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
      <path d="M530,205 L625,215 C645,245 635,295 605,320 L525,320 Z" fill="#fca5a5" stroke="#991b1b" stroke-width="2.5"/>
      <!-- Right Ventricle (RV) -->
      <path d="M368,350 C348,400 385,455 475,495 L485,350 Z" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2.5"/>
      <!-- Left Ventricle (LV) -->
      <path d="M515,335 L505,495 C565,465 615,390 600,335 Z" fill="#f87171" stroke="#991b1b" stroke-width="3.5"/>
      <!-- Interventricular Septum -->
      <path d="M485,335 L515,335 L508,505 L475,495 Z" fill="#be123c" stroke="#881337" stroke-width="2"/>
      <!-- Tricuspid Valve + Chordae Tendineae + Papillary Muscle -->
      <path d="M380,335 L410,365 M440,335 L420,365" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="410" y1="365" x2="405" y2="425" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="2,2"/>
      <line x1="420" y1="365" x2="435" y2="435" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="2,2"/>
      <polygon points="395,450 405,420 418,455" fill="#9f1239"/>
      <polygon points="425,465 435,432 448,472" fill="#9f1239"/>
      <!-- Mitral (Bicuspid) Valve + Chordae Tendineae -->
      <path d="M535,325 L555,360 M595,325 L572,360" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="555" y1="360" x2="545" y2="425" stroke="#fff1f2" stroke-width="2"/>
      <line x1="572" y1="360" x2="578" y2="420" stroke="#fff1f2" stroke-width="2"/>
      <!-- Aortic &amp; Pulmonary Semilunar Valves -->
      <circle cx="525" cy="235" r="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="483" cy="255" r="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="395" y1="155" x2="280" y2="135" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="395" cy="155" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
      <circle cx="395" cy="155" r="11" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="113" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#2563eb" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="113" width="28" height="44" rx="8" fill="#2563eb" />
        <text x="39" y="140" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="61" y="131" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Superior Vena Cava (SVC)</text>
        <text x="61" y="148" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือดดำใหญ่ส่วนบนเทเข้า RA</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="430" y1="275" x2="280" y2="235" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="430" cy="275" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
      <circle cx="430" cy="275" r="11" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="213" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="213" width="28" height="44" rx="8" fill="#0284c7" />
        <text x="39" y="240" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="61" y="231" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Fossa Ovalis (Interatrial Septum)</text>
        <text x="61" y="248" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">รอยบุ๋มรูปไข่ (ซาก Foramen ovale)</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="415" y1="365" x2="280" y2="345" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="415" cy="365" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="2" />
      <circle cx="415" cy="365" r="11" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="323" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#0d9488" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="323" width="28" height="44" rx="8" fill="#0d9488" />
        <text x="39" y="350" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="61" y="341" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tricuspid Valve &amp; Chordae Tendineae</text>
        <text x="61" y="358" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ลิ้นไตรคัสปิดและเอ็นยึดลิ้นหัวใจ</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="496" y1="435" x2="280" y2="455" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="496" cy="435" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="496" cy="435" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="433" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#e11d48" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="433" width="28" height="44" rx="8" fill="#e11d48" />
        <text x="39" y="460" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="61" y="451" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Interventricular Septum</text>
        <text x="61" y="468" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ผนังกั้นหัวใจห้องล่างซ้าย-ขวา</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="565" y1="355" x2="715" y2="335" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="565" cy="355" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="565" cy="355" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="313" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="313" width="28" height="44" rx="8" fill="#dc2626" />
        <text x="729" y="340" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="751" y="331" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Bicuspid (Mitral) Valve</text>
        <text x="751" y="348" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ลิ้นไมทรัล (2 แฉก) กั้น LA กับ LV</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="615" y1="395" x2="715" y2="445" stroke="#9f1239" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="615" cy="395" r="6" fill="#9f1239" stroke="#ffffff" stroke-width="2" />
      <circle cx="615" cy="395" r="11" fill="none" stroke="#9f1239" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="423" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#9f1239" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="423" width="28" height="44" rx="8" fill="#9f1239" />
        <text x="729" y="450" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="751" y="441" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Left Ventricular Myocardium</text>
        <text x="751" y="458" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">กล้ามเนื้อหัวใจห้องล่างซ้าย (หนา 3 เท่า)</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>