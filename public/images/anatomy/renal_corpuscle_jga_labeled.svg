<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Renal Corpuscle, Glomerular Filtration Barrier & Juxtaglomerular Apparatus</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Urinary System • โครงสร้างโกลเมอรูลัส เซลล์มีเท้า Podocytes และชุดควบคุมความดัน JGA</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Bowman's Capsule Cup -->
      <path d="M350,165 C555,115 685,220 685,320 C685,420 555,525 350,475 C420,435 420,205 350,165 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="4" filter="url(#dropShadow)"/>
      <path d="M685,285 L835,285 M685,355 L835,355" stroke="#ca8a04" stroke-width="4"/>
      <!-- Wide Afferent Arteriole (Top Left) with Granular JG cells -->
      <path d="M180,220 L385,265" stroke="#dc2626" stroke-width="24" stroke-linecap="round"/>
      <!-- Narrower Efferent Arteriole (Bottom Left) -->
      <path d="M180,420 L385,375" stroke="#ef4444" stroke-width="13" stroke-linecap="round"/>
      <!-- JG Granular Cells on Afferent Arteriole wall -->
      <circle cx="315" cy="235" r="9" fill="#fde047" stroke="#713f12" stroke-width="2"/>
      <circle cx="335" cy="240" r="9" fill="#fde047" stroke="#713f12" stroke-width="2"/>
      <circle cx="315" cy="265" r="9" fill="#fde047" stroke="#713f12" stroke-width="2"/>
      <!-- Distal Convoluted Tubule & Macula Densa touching Vascular Pole -->
      <ellipse cx="265" cy="320" rx="42" ry="52" fill="#fed7aa" stroke="#ea580c" stroke-width="3.5"/>
      <ellipse cx="265" cy="320" rx="22" ry="30" fill="#ffffff"/>
      <!-- Tall crowded Macula Densa cells on right side of DCT -->
      <rect x="292" y="295" width="14" height="50" rx="4" fill="#9a3412"/>
      <!-- Glomerular Capillary Tuft covered by Podocytes & Pedicels -->
      <path d="M385,265 C485,215 585,255 565,320 C585,385 485,425 385,375" fill="none" stroke="#dc2626" stroke-width="22" stroke-linecap="round"/>
      <!-- Podocyte Cell Body & Foot Processes (Pedicels) -->
      <circle cx="515" cy="265" r="18" fill="#38bdf8" stroke="#0369a1" stroke-width="2.5"/>
      <path d="M515,283 L495,305 M515,283 L515,305 M515,283 L535,305" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="245" y1="235" x2="260" y2="135" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="245" cy="235" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="245" cy="235" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="260" y="113" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="260" y="113" width="28" height="44" rx="8" fill="#dc2626" />
        <text x="274" y="140" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="296" y="131" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Afferent Arteriole & JG Granular Cells</text>
        <text x="296" y="148" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือดแดงขาเข้า (กว้างกว่า) และเซลล์ JG ที่หลั่งเอนไซม์ Renin</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="298" y1="320" x2="260" y2="320" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="298" cy="320" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
      <circle cx="298" cy="320" r="11" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="5" y="298" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#ea580c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="5" y="298" width="28" height="44" rx="8" fill="#ea580c" />
        <text x="19" y="325" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="41" y="316" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Macula Densa (in Distal Tubule)</text>
        <text x="41" y="333" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">กลุ่มเซลล์ทรงสูงในผนัง DCT ทำหน้าที่ตรวจจับความเข้มข้น NaCl</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="255" y1="405" x2="260" y2="485" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="255" cy="405" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="255" cy="405" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="260" y="463" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#e11d48" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="260" y="463" width="28" height="44" rx="8" fill="#e11d48" />
        <text x="274" y="490" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="296" y="481" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Efferent Arteriole (Narrower Lumen)</text>
        <text x="296" y="498" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">หลอดเลือดแดงขาออก (แคบกว่า เพื่อสร้างแรงดันกรอง GHP สูง 55 mmHg)</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="515" y1="265" x2="715" y2="175" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="515" cy="265" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
      <circle cx="515" cy="265" r="11" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="153" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="153" width="28" height="44" rx="8" fill="#0284c7" />
        <text x="729" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="751" y="171" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Podocytes & Filtration Slits (Visceral Layer)</text>
        <text x="751" y="188" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">เซลล์มีเท้าโอบรอบโกลเมอรูลัส เกิดเป็นร่องกรอง Filtration slits</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="615" y1="215" x2="715" y2="265" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="615" cy="215" r="6" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
      <circle cx="615" cy="215" r="11" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="243" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#ca8a04" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="243" width="28" height="44" rx="8" fill="#ca8a04" />
        <text x="729" y="270" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="751" y="261" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Bowman's Capsule (Parietal Layer & Space)</text>
        <text x="751" y="278" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ถุงหุ้มโกลเมอรูลัสชั้นนอก (Simple squamous) และช่องรับน้ำกรอง</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="765" y1="320" x2="715" y2="425" stroke="#d97706" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="765" cy="320" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="765" cy="320" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="460" y="403" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="460" y="403" width="28" height="44" rx="8" fill="#d97706" />
        <text x="474" y="430" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="496" y="421" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Proximal Convoluted Tubule (Urinary Pole)</text>
        <text x="496" y="438" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ท่อหน่วยไตส่วนต้น (PCT) มี Brush border ดูดกลับน้ำตาล 100%</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>