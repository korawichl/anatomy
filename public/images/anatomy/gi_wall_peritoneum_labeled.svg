<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Four Histological Layers of the Gastrointestinal Tract Wall</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Digestive System • โครงสร้างเนื้อเยื่อผนังทางเดินอาหาร 4 ชั้น และระบบประสาทลำไส้ (ENS)</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Cross section slabs of GI Wall from Inside Lumen (Top) to Outside Serosa (Bottom) -->
      <!-- Lumen -->
      <rect x="180" y="95" width="640" height="55" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
      <text x="500" y="128" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#854d0e" text-anchor="middle">GASTROINTESTINAL LUMEN (โพรงทางเดินอาหาร)</text>
      <!-- Layer 1: Mucosa (Epithelium + Lamina Propria + Muscularis Mucosae) -->
      <path d="M180,150 Q210,120 240,150 Q270,180 300,150 Q330,120 360,150 Q390,180 420,150 Q450,120 480,150 Q510,180 540,150 Q570,120 600,150 Q630,180 660,150 Q690,120 720,150 Q750,180 780,150 L820,150 L820,245 L180,245 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="3"/>
      <rect x="180" y="232" width="640" height="13" fill="#ec4899"/>
      <!-- Layer 2: Submucosa + Meissner's Plexus + Vessels -->
      <rect x="180" y="245" width="640" height="95" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
      <circle cx="320" cy="292" r="14" fill="#ef4444"/><circle cx="355" cy="292" r="14" fill="#3b82f6"/>
      <!-- Submucosal (Meissner's) Plexus nodes -->
      <circle cx="510" cy="290" r="13" fill="#facc15" stroke="#713f12" stroke-width="2.5"/>
      <circle cx="640" cy="290" r="13" fill="#facc15" stroke="#713f12" stroke-width="2.5"/>
      <!-- Layer 3: Muscularis Externa (Inner Circular + Myenteric Plexus + Outer Longitudinal) -->
      <rect x="180" y="340" width="640" height="70" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/>
      <!-- Myenteric (Auerbach's) Plexus between circular & longitudinal -->
      <circle cx="430" cy="410" r="15" fill="#fde047" stroke="#b45309" stroke-width="3"/>
      <circle cx="590" cy="410" r="15" fill="#fde047" stroke="#b45309" stroke-width="3"/>
      <rect x="180" y="410" width="640" height="65" fill="#f87171" stroke="#991b1b" stroke-width="3"/>
      <!-- Layer 4: Serosa / Visceral Peritoneum -->
      <rect x="180" y="475" width="640" height="38" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="250" y1="185" x2="280" y2="185" stroke="#db2777" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="250" cy="185" r="6" fill="#db2777" stroke="#ffffff" stroke-width="2" />
      <circle cx="250" cy="185" r="11" fill="none" stroke="#db2777" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="163" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#db2777" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="280" y="163" width="28" height="44" rx="8" fill="#db2777" />
        <text x="294" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="316" y="181" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mucosa (Epithelium & Lamina Propria)</text>
        <text x="316" y="198" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ชั้นเยื่อเมือกด้านในสุด (ดูดซึมและหลั่งเมือก)</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="250" y1="238" x2="280" y2="250" stroke="#be185d" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="250" cy="238" r="6" fill="#be185d" stroke="#ffffff" stroke-width="2" />
      <circle cx="250" cy="238" r="11" fill="none" stroke="#be185d" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="228" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#be185d" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="280" y="228" width="28" height="44" rx="8" fill="#be185d" />
        <text x="294" y="255" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="316" y="246" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Muscularis Mucosae</text>
        <text x="316" y="263" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">กล้ามเนื้อเรียบบางๆ แยก Mucosa กับ Submucosa</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="510" y1="290" x2="715" y2="270" stroke="#d97706" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="510" cy="290" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="510" cy="290" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="248" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="248" width="28" height="44" rx="8" fill="#d97706" />
        <text x="729" y="275" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="751" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Submucosa & Meissner's Plexus</text>
        <text x="751" y="283" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ชั้นใต้เยื่อเมือกและร่างแหประสาทควบคุมการหลั่งสาร</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="280" y1="375" x2="280" y2="375" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="280" cy="375" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="280" cy="375" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="353" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="280" y="353" width="28" height="44" rx="8" fill="#dc2626" />
        <text x="294" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="316" y="371" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Muscularis Externa (Inner Circular)</text>
        <text x="316" y="388" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ชั้นกล้ามเนื้อเรียบวงใน (หดตัวบีบรูดลูเมน)</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="590" y1="410" x2="715" y2="405" stroke="#b45309" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="590" cy="410" r="6" fill="#b45309" stroke="#ffffff" stroke-width="2" />
      <circle cx="590" cy="410" r="11" fill="none" stroke="#b45309" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="383" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#b45309" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="383" width="28" height="44" rx="8" fill="#b45309" />
        <text x="729" y="410" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="751" y="401" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Myenteric (Auerbach's) Plexus</text>
        <text x="751" y="418" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ร่างแหประสาทคั่นระหว่างกล้ามเนื้อ 2 ชั้น ควบคุม Peristalsis</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="500" y1="494" x2="715" y2="505" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="500" cy="494" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
      <circle cx="500" cy="494" r="11" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="483" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="715" y="483" width="28" height="44" rx="8" fill="#0284c7" />
        <text x="729" y="510" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="751" y="501" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Serosa (Visceral Peritoneum) / Adventitia</text>
        <text x="751" y="518" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ผนังชั้นนอกสุดห่อหุ้มทางเดินอาหาร</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>