<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Ureters, Urinary Bladder (Trigone & Sphincters) & Male Urethra Divisions</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Urinary System • ท่อไต 3 จุดคอดแคบ กระเพาะปัสสาวะ (Detrusor, Trigone) และท่อปัสสาวะ 3 ส่วน</text>
  <rect x="770" y="18" width="205" height="30" rx="15" fill="#dc2626" /><text x="872" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">❓ ภาพโจทย์สอบระบุตำแหน่ง (Exam)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Left & Right Ureters descending -->
      <path d="M355,100 C355,180 390,220 405,285" fill="none" stroke="#fde047" stroke-width="10" stroke-linecap="round"/>
      <path d="M645,100 C645,180 610,220 595,285" fill="none" stroke="#fde047" stroke-width="10" stroke-linecap="round"/>
      <!-- Urinary Bladder (Detrusor Muscle Wall) -->
      <ellipse cx="500" cy="300" rx="135" ry="95" fill="#fda4af" stroke="#9f1239" stroke-width="5" filter="url(#dropShadow)"/>
      <ellipse cx="500" cy="300" rx="108" ry="72" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
      <!-- Trigone Triangle (Smooth triangular floor) -->
      <polygon points="435,275 565,275 500,365" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
      <circle cx="435" cy="275" r="6" fill="#854d0e"/><circle cx="565" cy="275" r="6" fill="#854d0e"/>
      <!-- Prostate Gland surrounding Prostatic Urethra -->
      <path d="M445,380 L555,380 L535,445 L465,445 Z" fill="#c084fc" stroke="#6b21a8" stroke-width="3"/>
      <!-- Urogenital Diaphragm & External Urethral Sphincter (Skeletal) -->
      <rect x="415" y="445" width="170" height="25" rx="6" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
      <!-- Spongy (Penile) Urethra in Corpus Spongiosum -->
      <path d="M475,470 L475,545 L525,545 L525,470 Z" fill="#f43f5e" stroke="#881337" stroke-width="2.5"/>
      <!-- Continuous Urethral Lumen -->
      <line x1="500" y1="365" x2="500" y2="545" stroke="#fef9c3" stroke-width="7"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="375" y1="185" x2="255" y2="165" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="375" cy="185" r="6" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
      <circle cx="375" cy="185" r="11" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5" />
      
        <rect x="211" y="148" width="44" height="34" rx="8" fill="#ca8a04" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="233" y="171" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="375" y1="295" x2="255" y2="275" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="375" cy="295" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="375" cy="295" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="211" y="258" width="44" height="34" rx="8" fill="#e11d48" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="233" y="281" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="500" y1="315" x2="255" y2="380" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="500" cy="315" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="500" cy="315" r="11" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5" />
      
        <rect x="211" y="363" width="44" height="34" rx="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="233" y="386" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="485" y1="375" x2="715" y2="265" stroke="#be123c" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="485" cy="375" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2" />
      <circle cx="485" cy="375" r="11" fill="none" stroke="#be123c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="248" width="44" height="34" rx="8" fill="#be123c" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="737" y="271" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="530" y1="412" x2="715" y2="375" stroke="#7e22ce" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="530" cy="412" r="6" fill="#7e22ce" stroke="#ffffff" stroke-width="2" />
      <circle cx="530" cy="412" r="11" fill="none" stroke="#7e22ce" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="358" width="44" height="34" rx="8" fill="#7e22ce" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="737" y="381" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="550" y1="458" x2="715" y2="480" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="550" cy="458" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="550" cy="458" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="463" width="44" height="34" rx="8" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="737" y="486" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>