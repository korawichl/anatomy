<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Major Salivary Glands & Dorsal Surface of the Tongue</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Digestive System • ต่อมน้ำลายหลัก 3 คู่ (Parotid, Submandibular, Sublingual) และปุ่มลิ้น</text>
  <rect x="770" y="18" width="205" height="30" rx="15" fill="#dc2626" /><text x="872" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">❓ ภาพโจทย์สอบระบุตำแหน่ง (Exam)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Left Box: 3 Salivary Glands -->
      <rect x="65" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="275" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">THREE PAIRS OF SALIVARY GLANDS</text>
      <!-- Jaw & Oral Profile -->
      <path d="M140,180 C140,360 220,440 380,430" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
      <!-- Parotid Gland & Stensen's Duct -->
      <path d="M155,195 C125,215 130,305 175,320 C215,325 225,235 190,195 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
      <path d="M205,255 L325,255" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
      <!-- Submandibular Gland & Wharton's Duct -->
      <ellipse cx="235" cy="405" rx="48" ry="30" fill="#facc15" stroke="#b45309" stroke-width="3"/>
      <path d="M265,390 L365,345" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
      <!-- Sublingual Gland & Ducts of Rivinus -->
      <ellipse cx="355" cy="365" rx="36" ry="18" fill="#fef08a" stroke="#a16207" stroke-width="2.5"/>

      <!-- Right Box: Tongue Dorsum & Papillae -->
      <rect x="515" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="725" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">DORSUM OF TONGUE &amp; PAPILLAE</text>
      <!-- Tongue Shape -->
      <path d="M615,175 L835,175 L845,380 C845,495 605,495 605,380 Z" fill="#fda4af" stroke="#be123c" stroke-width="3.5"/>
      <!-- Sulcus Terminalis (V-shaped groove) & Foramen Cecum -->
      <path d="M610,285 L725,335 L840,285" fill="none" stroke="#881337" stroke-width="4"/>
      <circle cx="725" cy="335" r="7" fill="#4c0519"/>
      <!-- Circumvallate Papillae (V-row) -->
      <g fill="#e11d48" stroke="#ffffff" stroke-width="2">
        <circle cx="635" cy="272" r="10"/><circle cx="665" cy="285" r="10"/><circle cx="695" cy="298" r="10"/>
        <circle cx="725" cy="310" r="11"/>
        <circle cx="755" cy="298" r="10"/><circle cx="785" cy="285" r="10"/><circle cx="815" cy="272" r="10"/>
      </g>
      <!-- Filiform & Fungiform Papillae on Anterior 2/3 -->
      <g fill="#be123c">
        <circle cx="665" cy="390" r="5"/><circle cx="725" cy="410" r="4"/><circle cx="780" cy="385" r="5"/>
        <circle cx="690" cy="445" r="6"/><circle cx="760" cy="445" r="6"/>
      </g>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="175" y1="245" x2="280" y2="195" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="175" cy="245" r="6" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
      <circle cx="175" cy="245" r="11" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="178" width="44" height="34" rx="8" fill="#ca8a04" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="302" y="201" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="235" y1="405" x2="280" y2="425" stroke="#b45309" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="235" cy="405" r="6" fill="#b45309" stroke="#ffffff" stroke-width="2" />
      <circle cx="235" cy="405" r="11" fill="none" stroke="#b45309" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="408" width="44" height="34" rx="8" fill="#b45309" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="302" y="431" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="355" y1="365" x2="280" y2="325" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="355" cy="365" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="2" />
      <circle cx="355" cy="365" r="11" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
      
        <rect x="236" y="308" width="44" height="34" rx="8" fill="#0d9488" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="258" y="331" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="695" y1="298" x2="715" y2="235" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="695" cy="298" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="695" cy="298" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="715" y="218" width="44" height="34" rx="8" fill="#e11d48" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="737" y="241" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="725" y1="335" x2="715" y2="345" stroke="#881337" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="725" cy="335" r="6" fill="#881337" stroke="#ffffff" stroke-width="2" />
      <circle cx="725" cy="335" r="11" fill="none" stroke="#881337" stroke-width="1.5" opacity="0.5" />
      
        <rect x="671" y="328" width="44" height="34" rx="8" fill="#881337" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="693" y="351" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="725" y1="410" x2="715" y2="465" stroke="#be123c" stroke-width="2.2" stroke-dasharray="4,3" />
      <circle cx="725" cy="410" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2" />
      <circle cx="725" cy="410" r="11" fill="none" stroke="#be123c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="671" y="448" width="44" height="34" rx="8" fill="#be123c" stroke="#ffffff" stroke-width="2.5" filter="url(#dropShadow)" />
        <text x="693" y="471" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>