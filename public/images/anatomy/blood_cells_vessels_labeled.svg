<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="organPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="liverBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="lymphGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="urineYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Medical Grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.55">
    <line x1="0" y1="150" x2="1000" y2="150" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="450" x2="1000" y2="450" />
    <line x1="250" y1="65" x2="250" y2="620" />
    <line x1="500" y1="65" x2="500" y2="620" />
    <line x1="750" y1="65" x2="750" y2="620" />
  </g>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="66" rx="18" fill="#0f172a" />
  <rect x="0" y="48" width="1000" height="18" fill="#0f172a" />
  <text x="28" y="30" font-family="Inter, Sarabun, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">Hematology (Formed Elements) & Blood Vessel Wall Layers</text>
  <text x="28" y="51" font-family="Sarabun, Inter, sans-serif" font-size="12.5" font-weight="500" fill="#38bdf8">Cardiovascular System • สัณฐานวิทยาเม็ดเลือดชนิดต่างๆ และโครงสร้างผนังหลอดเลือด 3 ชั้น</text>
  <rect x="750" y="18" width="225" height="30" rx="15" fill="#059669" /><text x="862" y="38" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ เฉลยโครงสร้างครบทุกจุด (Master)</text>

  <!-- Main Anatomical Illustration -->
  <g transform="translate(0, 10)">
    
      <!-- Left Panel: Blood Smear Cells -->
      <rect x="60" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="270" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">PERIPHERAL BLOOD SMEAR</text>
      <!-- RBC Biconcave -->
      <circle cx="155" cy="195" r="34" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
      <circle cx="155" cy="195" r="15" fill="#fca5a5" opacity="0.8"/>
      <!-- Neutrophil (3-5 lobes) -->
      <circle cx="345" cy="195" r="38" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
      <circle cx="330" cy="185" r="10" fill="#6b21a8"/><circle cx="352" cy="180" r="10" fill="#6b21a8"/><circle cx="360" cy="202" r="10" fill="#6b21a8"/><circle cx="335" cy="210" r="9" fill="#6b21a8"/>
      <path d="M330,185 L352,180 L360,202 L335,210" fill="none" stroke="#6b21a8" stroke-width="3"/>
      <!-- Eosinophil (Bilobed + red granules) -->
      <circle cx="155" cy="325" r="38" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <circle cx="140" cy="325" r="13" fill="#581c87"/><circle cx="170" cy="325" r="13" fill="#581c87"/>
      <path d="M140,325 Q155,305 170,325" fill="none" stroke="#581c87" stroke-width="4"/>
      <!-- Monocyte (Kidney-shaped nucleus) -->
      <circle cx="345" cy="325" r="44" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <path d="M325,310 C315,330 330,350 355,345 C370,340 370,315 355,305 C345,300 345,325 335,320 Z" fill="#312e81"/>
      <!-- Megakaryocyte & Platelets -->
      <g fill="#7c3aed">
        <polygon points="240,450 252,445 248,458"/><polygon points="265,460 278,455 272,468"/><polygon points="250,475 262,472 258,485"/>
      </g>

      <!-- Right Panel: Blood Vessel Tunics -->
      <rect x="520" y="95" width="420" height="445" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="730" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">ARTERIAL WALL HISTOLOGY (3 TUNICS)</text>
      <!-- Concentric Tunics -->
      <circle cx="730" cy="325" r="145" fill="#fde68a" stroke="#ca8a04" stroke-width="3"/>
      <circle cx="730" cy="325" r="105" fill="#f87171" stroke="#b91c1c" stroke-width="4"/>
      <circle cx="730" cy="325" r="58" fill="#fecdd3" stroke="#991b1b" stroke-width="3" stroke-dasharray="6,3"/>
      <circle cx="730" cy="325" r="42" fill="#7f1d1d"/>
    
  </g>

  <!-- Callout Pins -->
  <g transform="translate(0, 10)">
    
    <!-- Landmark Pin A -->
    <g class="landmark-group">
      <line x1="155" y1="195" x2="280" y2="155" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="155" cy="195" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
      <circle cx="155" cy="195" r="11" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="133" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#dc2626" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="280" y="133" width="28" height="44" rx="8" fill="#dc2626" />
        <text x="294" y="160" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
        <text x="316" y="151" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Erythrocyte (Biconcave RBC)</text>
        <text x="316" y="168" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">เม็ดเลือดแดงรูปจานเว้าสองด้าน ไม่มีนิวเคลียส</text>
      
    </g>
  

    <!-- Landmark Pin B -->
    <g class="landmark-group">
      <line x1="360" y1="195" x2="280" y2="255" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="360" cy="195" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2" />
      <circle cx="360" cy="195" r="11" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="233" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#9333ea" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="233" width="28" height="44" rx="8" fill="#9333ea" />
        <text x="39" y="260" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
        <text x="61" y="251" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Neutrophil (3-5 Lobed PMN)</text>
        <text x="61" y="268" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">นิวโทรฟิล (60-70%) กำจัดแบคทีเรียด่านแรก</text>
      
    </g>
  

    <!-- Landmark Pin C -->
    <g class="landmark-group">
      <line x1="155" y1="325" x2="280" y2="385" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="155" cy="325" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
      <circle cx="155" cy="325" r="11" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="280" y="363" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#ea580c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="280" y="363" width="28" height="44" rx="8" fill="#ea580c" />
        <text x="294" y="390" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
        <text x="316" y="381" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Eosinophil (Bilobed Nucleus)</text>
        <text x="316" y="398" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">อีโอซิโนฟิล (แกรนูลสีส้มแดง ทำลายพยาธิ/ภูมิแพ้)</text>
      
    </g>
  

    <!-- Landmark Pin D -->
    <g class="landmark-group">
      <line x1="345" y1="325" x2="280" y2="475" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="345" cy="325" r="6" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />
      <circle cx="345" cy="325" r="11" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.5" />
      
        <rect x="25" y="453" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#4f46e5" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="25" y="453" width="28" height="44" rx="8" fill="#4f46e5" />
        <text x="39" y="480" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
        <text x="61" y="471" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Monocyte (Kidney-shaped Nucleus)</text>
        <text x="61" y="488" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">โมโนไซต์ (ใหญ่ที่สุด เปลี่ยนเป็น Macrophage)</text>
      
    </g>
  

    <!-- Landmark Pin E -->
    <g class="landmark-group">
      <line x1="730" y1="272" x2="715" y2="185" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="730" cy="272" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="730" cy="272" r="11" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.5" />
      
        <rect x="460" y="163" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#e11d48" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="460" y="163" width="28" height="44" rx="8" fill="#e11d48" />
        <text x="474" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
        <text x="496" y="181" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tunica Intima (Endothelium)</text>
        <text x="496" y="198" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ผนังชั้นในสุดสัมผัสเลือด ต่อเนื่องกับ Endocardium</text>
      
    </g>
  

    <!-- Landmark Pin F -->
    <g class="landmark-group">
      <line x1="810" y1="325" x2="715" y2="465" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="none" />
      <circle cx="810" cy="325" r="6" fill="#b91c1c" stroke="#ffffff" stroke-width="2" />
      <circle cx="810" cy="325" r="11" fill="none" stroke="#b91c1c" stroke-width="1.5" opacity="0.5" />
      
        <rect x="460" y="443" width="255" height="44" rx="8" fill="#0f172a" fill-opacity="0.93" stroke="#b91c1c" stroke-width="2" filter="url(#dropShadow)" />
        <rect x="460" y="443" width="28" height="44" rx="8" fill="#b91c1c" />
        <text x="474" y="470" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">F</text>
        <text x="496" y="461" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tunica Media (Smooth Muscle & Elastin)</text>
        <text x="496" y="478" font-family="Sarabun, Inter, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ผนังชั้นกลาง (หนาสุดใน Artery ควบคุมความดัน)</text>
      
    </g>
  
  </g>

  <!-- Footer -->
  <text x="500" y="606" font-family="Sarabun, Inter, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Anatomy Exam Lab — High-Resolution Medical Vector Atlas (Aligned with BNS102 RSU Lecture Slides)
  </text>
</svg>